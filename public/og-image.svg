<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Deep dark luxury background -->
  <rect width="1200" height="630" fill="url(#grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Accent glow border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#242424" stroke-width="1.5" />

  <!-- Status pill -->
  <g transform="translate(100, 90)">
    <rect width="210" height="36" rx="18" fill="#141414" stroke="#282828" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#34c759" />
    <text x="36" y="23" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#a0a0a0" letter-spacing="1.5">ENDRA PLATFORM</text>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(100, 160)">
    <!-- Top Capsule -->
    <rect x="0" y="0" width="90" height="34" rx="17" fill="#ffffff" />
    <circle cx="22" cy="17" r="7" fill="#080808" />
    <!-- Bottom Capsule -->
    <rect x="0" y="44" width="90" height="34" rx="17" fill="#ff3b30" />
    <circle cx="22" cy="61" r="7" fill="#080808" />
    <!-- ENDRA Wordmark -->
    <text x="120" y="66" font-family="'DM Sans', system-ui, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="10">ENDRA</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="340" font-family="'DM Sans', system-ui, sans-serif" font-size="46" font-weight="700" fill="#f8f8f8" letter-spacing="-0.5">
    Know your property is safe,
  </text>
  <text x="100" y="398" font-family="'DM Sans', system-ui, sans-serif" font-size="46" font-weight="700" fill="#a0a0a0" letter-spacing="-0.5">
    wherever you are.
  </text>

  <!-- Product Features / Description -->
  <text x="100" y="465" font-family="'DM Sans', system-ui, sans-serif" font-size="22" font-weight="400" fill="#747474">
    Live AI surveillance, verified emergency response, and intelligent property defense.
  </text>

  <!-- Footer indicators -->
  <g transform="translate(100, 530)">
    <circle cx="6" cy="6" r="4" fill="#34c759" />
    <text x="22" y="11" font-family="'DM Mono', monospace" font-size="14" fill="#747474" letter-spacing="1">LIVE CAMERAS</text>

    <circle cx="196" cy="6" r="4" fill="#ff9500" />
    <text x="212" y="11" font-family="'DM Mono', monospace" font-size="14" fill="#747474" letter-spacing="1">AI INTRUSION</text>

    <circle cx="376" cy="6" r="4" fill="#ff3b30" />
    <text x="392" y="11" font-family="'DM Mono', monospace" font-size="14" fill="#747474" letter-spacing="1">ONE-TAP SOS</text>
  </g>

  <text x="1090" y="541" text-anchor="end" font-family="'DM Mono', monospace" font-size="14" font-weight="500" fill="#505050" letter-spacing="1">
    ENDRA.COM
  </text>
</svg>