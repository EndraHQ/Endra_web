<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Radial Depth Gradient (Black / Near-Black) -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="65%" stop-color="#070709" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="techGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1" fill="rgba(255, 255, 255, 0.12)" />
    </pattern>

    <!-- Crosshair Symbol -->
    <g id="crosshair">
      <path d="M -8 0 L 8 0 M 0 -8 L 0 8" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    </g>
  </defs>

  <style>
    .mono { font-family: 'DM Mono', monospace, ui-monospace, SFMono-Regular, Menlo, Consolas; }
    .sans { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Deep Black / Monochromatic Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="630" fill="url(#techGrid)"/>

  <!-- Subtle Corner Technical Framing / Brackets -->
  <path d="M 36 60 L 36 36 L 60 36" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  <path d="M 1164 60 L 1164 36 L 1140 36" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  <path d="M 36 570 L 36 594 L 60 594" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  <path d="M 1164 570 L 1164 594 L 1140 594" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>

  <!-- Crosshairs at Key Grid Points -->
  <use href="#crosshair" x="180" y="120"/>
  <use href="#crosshair" x="1020" y="120"/>
  <use href="#crosshair" x="180" y="510"/>
  <use href="#crosshair" x="1020" y="510"/>

  <!-- Top System Badge: Positioning Statement (Pillchip from official site) -->
  <g transform="translate(600, 115)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <!-- Status Indicator Dot -->
    <circle cx="-212" cy="0" r="4" fill="#FFFFFF"/>
    <circle cx="-212" cy="0" r="8" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
    <text x="-194" y="5" class="sans" font-size="13" font-weight="600" fill="#E4E4E7" letter-spacing="1.2">AFRICA'S INTELLIGENT SAFETY &amp; SECURITY PLATFORM</text>
  </g>

  <!-- CENTER: OFFICIAL ENDRA WORDMARK -->
  <!-- Target width: 580px, height: 131.3px. Centered at X=600, Y=265 -->
  <!-- Original center is (1135.21, 558) with scale 0.25546 -->
  <g transform="translate(600, 260) scale(0.25546) translate(-1135.21, -558)">
    <!-- Official Geometric E Symbol -->
    <path d="M0 301H456V398H70V442H456V539H0ZM0 577H456V674H70V718H456V815H0Z" fill="#FFFFFF"/>
    <!-- Official NDRA Letters -->
    <path d="M561.92 806V302H747.68L806.72 758.48H819.68V302H914.72V806H728.96L669.92 349.52H656.96V806H561.92ZM991.979 806V714.56H1039.5V392.72H991.979V302H1174.86C1236.78 302 1282.86 316.64 1313.1 345.92C1343.82 375.2 1359.18 420.08 1359.18 480.56V627.44C1359.18 687.92 1343.82 732.8 1313.1 762.08C1282.86 791.36 1236.78 806 1174.86 806H991.979ZM1134.54 715.28H1174.86C1207.98 715.28 1231.02 707.6 1243.98 692.24C1257.42 676.4 1264.14 651.92 1264.14 618.8V480.56C1264.14 451.76 1257.42 429.92 1243.98 415.04C1231.02 400.16 1207.98 392.72 1174.86 392.72H1134.54V715.28ZM1452.28 806V302H1645.24C1679.8 302 1708.84 308.24 1732.36 320.72C1755.88 333.2 1773.64 350 1785.64 371.12C1797.64 391.76 1803.64 415.04 1803.64 440.96V458.24C1803.64 478.88 1797.88 498.32 1786.36 516.56C1775.32 534.32 1758.52 548 1735.96 557.6V570.56C1752.76 572.48 1765.96 578.96 1775.56 590C1785.64 601.04 1790.68 614.96 1790.68 631.76V806H1695.64V654.8C1695.64 643.28 1692.52 633.92 1686.28 626.72C1680.52 619.52 1670.68 615.92 1656.76 615.92H1547.32V806H1452.28ZM1547.32 525.2H1638.04C1661.08 525.2 1678.6 519.68 1690.6 508.64C1702.6 497.6 1708.6 482.48 1708.6 463.28V454.64C1708.6 437.84 1702.6 423.44 1690.6 411.44C1678.6 398.96 1661.08 392.72 1638.04 392.72H1547.32V525.2ZM1851.38 806L1971.62 302H2150.18L2270.42 806H2171.06L2146.58 698H1975.22L1950.74 806H1851.38ZM1995.38 607.28H2125.7L2067.38 349.52H2054.42L1995.38 607.28Z" fill="#FFFFFF"/>
  </g>

  <!-- Tagline: "Know First. Respond Faster." -->
  <g transform="translate(600, 395)">
    <text text-anchor="middle" class="sans" font-size="34" font-weight="700" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Know First.</tspan>
      <tspan fill="rgba(255, 255, 255, 0.4)"> </tspan>
      <tspan fill="#A1A1AA">Respond Faster.</tspan>
    </text>
  </g>

  <!-- Secondary Positioning Text -->
  <g transform="translate(600, 440)">
    <text text-anchor="middle" class="sans" font-size="17" font-weight="400" fill="#71717A" letter-spacing="0.2">
      AI-Powered Threat Intelligence &amp; Autonomous Perimeter Defense
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="420" y1="482" x2="780" y2="482" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Bottom Technical Telemetry Bar -->
  <g transform="translate(0, 560)">
    <text x="60" y="0" class="mono" font-size="12" fill="rgba(255, 255, 255, 0.35)" letter-spacing="1">ENDRA TECHNOLOGIES LIMITED</text>
    <text x="600" y="0" class="mono" font-size="12" fill="rgba(255, 255, 255, 0.3)" text-anchor="middle" letter-spacing="1.5">INTELLIGENT DEFENSE PLATFORM</text>
    <text x="1140" y="0" class="mono" font-size="12" fill="rgba(255, 255, 255, 0.4)" text-anchor="end" letter-spacing="0.5">endratech.com</text>
  </g>
</svg>